version: "3.8"

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: knowledge-hub-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # RedisInsight (web UI)
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1
    restart: unless-stopped

volumes:
  redis-data:
